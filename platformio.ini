[env:crowpanel-7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/patch_lovyangfx.py
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz
monitor_speed = 115200
upload_speed = 921600
build_type = release

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv

build_src_filter = +<*> -<sensor_test_main.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -Wall
    -Wextra
    -Wno-unused-parameter

lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@1.2.25

